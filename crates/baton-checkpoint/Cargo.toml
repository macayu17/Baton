[package]
name = "baton-checkpoint"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
experimental = ["dep:blake3", "dep:zstd", "dep:serde_json", "dep:unicode-normalization", "dep:winapi-util"]

[dependencies]
baton-protocol = { path = "../baton-protocol" }
blake3 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winapi-util = { version = "0.1", optional = true }

[dev-dependencies]
baton-test-support = { path = "../baton-test-support" }
tempfile.workspace = true

[[test]]
name = "snapshots"
required-features = ["experimental"]

[lints]
workspace = true
