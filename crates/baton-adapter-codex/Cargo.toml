[package]
name = "baton-adapter-codex"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
experimental = ["baton-supervisor/experimental", "dep:serde", "dep:serde_json", "dep:tokio", "dep:blake3"]

[dependencies]
baton-protocol = { path = "../baton-protocol" }
baton-supervisor = { path = "../baton-supervisor" }
baton-store = { path = "../baton-store" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["process"] }

[dev-dependencies]
baton-test-support = { path = "../baton-test-support" }
tempfile.workspace = true
tokio.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[[bin]]
name = "baton-codex-protocol-fixture"
path = "tests/support/protocol_fixture.rs"
required-features = ["experimental"]

[[test]]
name = "handshake"
required-features = ["experimental"]

[lints]
workspace = true
